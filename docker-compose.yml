services:
  dns:
    image: coredns/coredns@sha256:7efd3c635b03efd68c4e8398fc45f0d993d0e9ab016f72c1cefb0fd6d01aa286
    container_name: qlkh_dns
    restart: unless-stopped
    profiles: ["lan-dns"]
    command: ["-conf", "/etc/coredns/Corefile"]
    ports:
      - "10.8.0.119:53:53/udp"
      - "10.8.0.119:53:53/tcp"
    volumes:
      - ./dns/Corefile:/etc/coredns/Corefile:ro
    healthcheck:
      test: ["CMD", "/coredns", "-version"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - qlkh_network

  redis:
    image: redis:7-alpine
    container_name: qlkh_redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "1gb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - qlkh_network

  postgres:
    image: postgres:16
    container_name: qlkh_postgres
    restart: unless-stopped
    shm_size: "1gb"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - qlkh_network

  backend:
    build:
      context: ./backend
    container_name: qlkh_backend
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-QUANLYKHACHHANG}
      DATABASE_URL: ${DATABASE_URL}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:3000}
      IMPORT_WORKER_COUNT: ${IMPORT_WORKER_COUNT:-1}
      IMPORT_CHUNK_SIZE: ${IMPORT_CHUNK_SIZE:-20000}
      DELETE_UPLOAD_AFTER_SUCCESS: ${DELETE_UPLOAD_AFTER_SUCCESS:-true}
      PROCESSING_WORK_MEM: ${PROCESSING_WORK_MEM:-256MB}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      ANALYSIS_CACHE_TTL: ${ANALYSIS_CACHE_TTL:-900}
      ANALYSIS_CACHE_MAX_BYTES: ${ANALYSIS_CACHE_MAX_BYTES:-20000000}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required and must contain at least 32 characters}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-240}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/exports:/app/exports
      - ./documents:/documents:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - qlkh_network

  frontend:
    build:
      context: ./frontend
    container_name: qlkh_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - qlkh_network

volumes:
  postgres_data:
    name: quanlykhachhang_postgres_data

networks:
  qlkh_network:
    name: qlkh_network
